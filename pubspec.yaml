name: friendbook
description: A modern social app for connecting with friends.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.5.0
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  video_player: ^2.8.1
  timeago: ^3.6.1
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
